
<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <p>Training Administration Panel</p>

    <h2>Registered Users</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
        </tr>

        {% for user in users %}

        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
        </tr>

        {% endfor %}

    </table>

    <a href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
